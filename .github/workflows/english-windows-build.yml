name: English Windows Build

on:
  push:
    branches:
      - english-translation
    paths:
      - ".github/workflows/english-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      AI_NOVEL_RELEASE_CHANNEL: release
      AI_NOVEL_ALLOW_UNSIGNED_RELEASE: "true"
      AI_NOVEL_DATABASE_MODE: sqlite
      AI_NOVEL_GITHUB_OWNER: thisless
      AI_NOVEL_GITHUB_REPO: AI-Novel-Writing-Assistant
      DATABASE_URL: file:./dev.db
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm stage:desktop
      - name: Build Windows installer and portable app
        run: node desktop/scripts/run-electron-builder.cjs --win --x64 --publish never
      - name: Verify packaged desktop layout
        run: node desktop/scripts/verify-desktop-package.cjs
      - uses: actions/upload-artifact@v6
        with:
          name: english-windows-x64
          path: |
            desktop/build/dist/*-setup-x64.exe
            desktop/build/dist/*-portable-x64.exe
          if-no-files-found: error
